<!-- .pet — невидимая точка в центре капибары; сама капибара и облачко позиционируются от неё -->
<div
  class="pet"
  [style.left.px]="cx()"
  [style.top.px]="cy()"
  [class.held]="dragging()"
  [class.snapping]="snapping()"
>
  @if (message()) {
    <div class="bubble" [attr.data-side]="bubbleSide()" [attr.data-align]="bubbleAlign()" role="status">
      {{ message() | t }} ♥
    </div>
  }

  <button
    type="button"
    class="capy"
    [style.transform]="'translate(-50%, -50%) rotate(' + angle() + 'deg)'"
    [attr.aria-label]="'pet.label' | t"
    [title]="'pet.label' | t"
    (click)="onClick()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
  >
    @if (dragging()) {
      <!-- в руках: висит лицом к нам -->
      <svg
        class="held-svg"
        [attr.viewBox]="heldViewBox"
        [attr.width]="heldWidth"
        [attr.height]="heldHeight"
        shape-rendering="crispEdges"
        aria-hidden="true"
      >
        @for (p of heldPixels; track $index) {
          <svg:rect [attr.x]="p.x" [attr.y]="p.y" width="1" height="1" [attr.fill]="p.color" />
        }
      </svg>
    } @else {
      <svg [attr.viewBox]="viewBox" [attr.width]="width" [attr.height]="height" shape-rendering="crispEdges" aria-hidden="true">
        <!-- идёт «назад» — отражаем рисунок по горизонтали -->
        <svg:g [attr.transform]="flip() ? 'translate(24 0) scale(-1 1)' : null">
          @for (p of frames[frame()]; track $index) {
            <svg:rect [attr.x]="p.x" [attr.y]="p.y" width="1" height="1" [attr.fill]="p.color" />
          }
        </svg:g>
      </svg>
    }
  </button>
</div>

@if (level() > 0) {
  <div class="strength" [attr.data-level]="level()" aria-live="polite">
    <div class="bars" aria-hidden="true">
      <span [class.on]="level() >= 1"></span>
      <span [class.on]="level() >= 2"></span>
      <span [class.on]="level() >= 3"></span>
    </div>
    <p class="label">{{ 'strength.title' | t }}: <strong>{{ labelKey() | t }}</strong></p>
    @if (level() < 3 && hints().length) {
      <ul class="hints">
        @for (hint of hints(); track hint) {
          <li>{{ hint | t }}</li>
        }
      </ul>
    }
  </div>
}

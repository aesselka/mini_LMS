<header class="topbar">
  @if (auth.isLoggedIn()) {
    <!-- ☰ открывает боковое меню (видна только на телефоне) -->
    <button type="button" class="icon-btn burger" [attr.aria-label]="'nav.menu' | t" (click)="layout.toggleMenu()">
      <app-icon name="menu" />
    </button>

    <!-- кнопка поиска: открывает окно Ctrl+K -->
    <button type="button" class="search-btn" (click)="layout.openPalette()">
      <app-icon name="search" [size]="18" />
      <span class="search-text">{{ 'search.placeholder' | t }}</span>
      <kbd>Ctrl K</kbd>
    </button>
  } @else {
    <a class="brand" routerLink="/login">
      <app-avatar [size]="32" [preview]="logo" />
      <span>Mini LMS</span>
    </a>
  }

  <div class="spacer"></div>

  <div class="langs" role="group" aria-label="Language">
    @for (lang of i18n.languages; track lang) {
      <button
        type="button"
        [class.active]="i18n.lang() === lang"
        [attr.aria-pressed]="i18n.lang() === lang"
        (click)="i18n.use(lang)"
      >
        {{ lang.toUpperCase() }}
      </button>
    }
  </div>

  <button
    type="button"
    class="icon-btn"
    [attr.aria-label]="(theme.theme() === 'dark' ? 'theme.toLight' : 'theme.toDark') | t"
    [title]="(theme.theme() === 'dark' ? 'theme.toLight' : 'theme.toDark') | t"
    (click)="theme.toggle()"
  >
    <app-icon [name]="theme.theme() === 'dark' ? 'sun' : 'moon'" />
  </button>

  @if (auth.isLoggedIn()) {
    <app-bell />

    <a
      class="avatar-link"
      routerLink="/profile"
      routerLinkActive="active"
      [attr.aria-label]="'nav.profile' | t"
      [title]="'nav.profile' | t"
    >
      <app-avatar [size]="34" />
    </a>
  } @else {
    <nav class="guest-nav">
      <a routerLink="/login" routerLinkActive="active">{{ 'nav.login' | t }}</a>
      <a routerLink="/register" class="btn-primary">{{ 'nav.register' | t }}</a>
    </nav>
  }
</header>

<header class="header">
  <a class="brand" routerLink="/" (click)="closeMenu()">Mini LMS</a>

  <div class="langs" role="group" aria-label="Language">
    @for (lang of i18n.languages; track lang) {
      <button
        type="button"
        [class.active]="i18n.lang() === lang"
        [attr.aria-pressed]="i18n.lang() === lang"
        (click)="i18n.use(lang)"
      >
        {{ lang.toUpperCase() }}
      </button>
    }
  </div>

  <!-- Переключатель темы: светлая / тёмная -->
  <button
    type="button"
    class="theme-btn"
    [attr.aria-label]="(theme.theme() === 'dark' ? 'theme.toLight' : 'theme.toDark') | t"
    [title]="(theme.theme() === 'dark' ? 'theme.toLight' : 'theme.toDark') | t"
    (click)="theme.toggle()"
  >
    {{ theme.theme() === 'dark' ? '☀' : '☾' }}
  </button>

  <!-- Аватар справа, рядом с темой: ведёт в профиль (настройки — кнопка ⚙ в профиле) -->
  @if (auth.isLoggedIn()) {
    <a
      class="avatar-link"
      routerLink="/profile"
      routerLinkActive="active"
      [attr.aria-label]="'nav.profile' | t"
      [title]="'nav.profile' | t"
      (click)="closeMenu()"
    >
      <app-avatar [size]="34" />
    </a>
  }

  <!-- Кнопка-бургер: видна только на узких экранах (телефон) -->
  <button
    type="button"
    class="burger"
    aria-controls="main-nav"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="'nav.menu' | t"
    (click)="toggleMenu()"
  >
    <span></span><span></span><span></span>
  </button>

  <!-- Клик по любой ссылке закрывает меню на телефоне -->
  <nav id="main-nav" class="nav" [class.open]="menuOpen()" (click)="closeMenu()">
    @if (auth.isLoggedIn()) {
      <a routerLink="/courses" routerLinkActive="active">{{ 'nav.courses' | t }}</a>
      <a routerLink="/my-courses" routerLinkActive="active">{{ 'nav.my_courses' | t }}</a>
      @if (auth.user()?.role === 'teacher') {
        <a routerLink="/teacher" routerLinkActive="active">{{ 'nav.cabinet' | t }}</a>
      }
    } @else {
      <a routerLink="/login" routerLinkActive="active">{{ 'nav.login' | t }}</a>
      <a routerLink="/register" routerLinkActive="active">{{ 'nav.register' | t }}</a>
    }
  </nav>
</header>

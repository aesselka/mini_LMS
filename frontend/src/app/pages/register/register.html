<section class="card">
  <h1>{{ 'register.title' | t }}</h1>

  <form (ngSubmit)="submit()" novalidate>
    <div class="row">
      <label>
        {{ 'fields.firstName' | t }}
        <input name="first_name" [(ngModel)]="form.first_name" autocomplete="given-name" />
      </label>
      <label>
        {{ 'fields.lastName' | t }}
        <input name="last_name" [(ngModel)]="form.last_name" autocomplete="family-name" />
      </label>
    </div>

    <label>
      {{ 'fields.username' | t }} *
      <input name="username" [(ngModel)]="form.username" autocomplete="username" />
    </label>

    <label>
      {{ 'fields.email' | t }} *
      <input name="email" type="email" [(ngModel)]="form.email" autocomplete="email" />
    </label>

    <label>
      {{ 'fields.password' | t }} *
      <span class="pw-field">
        <input
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          [(ngModel)]="form.password"
          autocomplete="new-password"
        />
        <app-eye-toggle [visible]="showPassword()" (toggle)="showPassword.set(!showPassword())" />
      </span>
    </label>

    <!-- индикатор надёжности пароля -->
    <app-password-strength [password]="form.password" />

    <label>
      {{ 'fields.confirmPassword' | t }} *
      <span class="pw-field">
        <input
          name="confirmPassword"
          [type]="showConfirm() ? 'text' : 'password'"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
        />
        <app-eye-toggle [visible]="showConfirm()" (toggle)="showConfirm.set(!showConfirm())" />
      </span>
    </label>

    <label>
      {{ 'fields.role' | t }}
       <select [(ngModel)]="form.role" name="role">
  <option value="student">{{ 'roles.student' | t }}</option>
  <option value="teacher">{{ 'roles.teacher' | t }}</option>
  </select>
   </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() | t }}</p>
    }
    @if (serverErrors().length) {
      <ul class="error" role="alert">
        @for (msg of serverErrors(); track msg) {
            <li>{{ msg | t }}</li>
        }
      </ul>
    }

    <button type="submit" class="btn" [disabled]="loading()">
      {{ (loading() ? 'common.loading' : 'register.submit') | t }}
    </button>
  </form>

  <p class="hint">
    {{ 'register.haveAccount' | t }}
    <a routerLink="/login">{{ 'register.loginLink' | t }}</a>
  </p>
</section>

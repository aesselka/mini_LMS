<section class="card">
  <h1>{{ 'forgot.title' | t }}</h1>

  @if (sent()) {
    <p class="success" role="status">{{ 'forgot.sent' | t }}</p>

    @if (devLink()) {
      <div class="dev-box">
        <p class="dev-title">🛠 {{ 'forgot.devTitle' | t }}</p>
        <p class="dev-text">{{ 'forgot.devText' | t }}</p>
        <a class="btn" [href]="devLink()">{{ 'forgot.devOpen' | t }}</a>
      </div>
    }
  } @else {
    <p class="hint-top">{{ 'forgot.text' | t }}</p>

    <form (ngSubmit)="submit()" novalidate>
      <label>
        {{ 'fields.email' | t }}
        <input name="email" type="email" [(ngModel)]="email" autocomplete="email" />
      </label>

      @if (error()) {
        <p class="error" role="alert">{{ error() | t }}</p>
      }

      <button type="submit" class="btn" [disabled]="loading()">
        {{ (loading() ? 'common.loading' : 'forgot.submit') | t }}
      </button>
    </form>
  }

  <p class="hint">
    <a routerLink="/login">{{ 'forgot.backToLogin' | t }}</a>
  </p>
</section>

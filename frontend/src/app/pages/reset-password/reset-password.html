<section class="card">
  <h1>{{ 'reset.title' | t }}</h1>

  @if (done()) {
    <p class="success" role="status">{{ 'reset.done' | t }}</p>
    <a class="btn btn-link" routerLink="/login">{{ 'reset.goToLogin' | t }}</a>
  } @else if (linkInvalid()) {
    <p class="error" role="alert">{{ 'reset.invalidLink' | t }}</p>
    <p class="hint">
      <a routerLink="/forgot-password">{{ 'reset.requestNew' | t }}</a>
    </p>
  } @else {
    <form (ngSubmit)="submit()" novalidate>
      <label>
        {{ 'reset.newPassword' | t }}
        <span class="pw-field">
          <input
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            autocomplete="new-password"
          />
          <app-eye-toggle [visible]="showPassword()" (toggle)="showPassword.set(!showPassword())" />
        </span>
      </label>

      <app-password-strength [password]="password" />

      <label>
        {{ 'fields.confirmPassword' | t }}
        <span class="pw-field">
          <input
            name="confirmPassword"
            [type]="showConfirm() ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            autocomplete="new-password"
          />
          <app-eye-toggle [visible]="showConfirm()" (toggle)="showConfirm.set(!showConfirm())" />
        </span>
      </label>

      @if (error()) {
        <p class="error" role="alert">{{ error() | t }}</p>
      }

      <button type="submit" class="btn" [disabled]="loading()">
        {{ (loading() ? 'common.loading' : 'reset.submit') | t }}
      </button>
    </form>
  }
</section>
